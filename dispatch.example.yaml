server: http://server:8000
runtime:
  interval: 2
  # Limits count all active tasks, including reason, bootstrap and conclude.
  max_workers: 16
  max_running_projects: 4
  max_project_workers: 4
  healthcheck_timeout: 30
  worker_healthcheck: startup_only
tasks:
  bootstrap:
    timeout: 0
    conclude_timeout: 60
  reason:
    # Maximum reasoning can span several model requests and graph reads.
    timeout: 300
    max_intents: 3
  explore:
    timeout: 0
    conclude_timeout: 60
container:
  image: xloom-worker:dev
  network_mode: bridge
  completed_action: stop
  namespace: xloom
common_env:
  ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL}
  ANTHROPIC_DEFAULT_FABLE_MODEL: ${ANTHROPIC_DEFAULT_FABLE_MODEL}
  ANTHROPIC_AUTH_TOKEN: ${ANTHROPIC_AUTH_TOKEN}
  XLOOM_REASONING_EFFORT: max
  XLOOM_MAX_OUTPUT_TOKENS: '32768'
  XLOOM_CONTEXT_TOKENS: '920000'
  XLOOM_CONTEXT_TARGET_TOKENS: '250000'
  XLOOM_CONTEXT_BYTES: '8388608'
workers:
  - name: general
    type: go
    task_types: [bootstrap, reason, explore]
    # Per-backend limit shared across all projects; still bounded by runtime limits.
    max_running: 16
    priority: 0

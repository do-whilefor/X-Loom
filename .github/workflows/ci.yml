name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Linux tests, vet and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Test, vet and compile
        run: docker build --target build --progress=plain .

      - name: Set up Node for workbench tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check workbench scripts and regressions
        run: |
          for script in web/static/*.js; do node --check "$script"; done
          node --test web/*_test.cjs
